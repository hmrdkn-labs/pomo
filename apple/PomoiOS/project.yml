# Generate the Xcode project with:  nix run nixpkgs#xcodegen -- generate   (or `xcodegen generate`)
# The .xcodeproj is not checked in. Build PomoKit's xcframework first (see README.md).
name: Pomo

options:
  bundleIdPrefix: dev.hamardikan.pomo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team id to run on a device (see README.md). Empty keeps simulator builds working unsigned.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # PomoFFI.xcframework has arm64 slices only (device and Apple-silicon simulator).
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  PomoKit:
    path: ../PomoKit
  PomoUI:
    path: ../shared

targets:
  Pomo:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - package: PomoKit
        product: PomoKit
      - package: PomoKit
        product: PomoLive
      - package: PomoUI
        product: PomoUI
      - target: PomoWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamardikan.pomo.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Pomo-Info.plist
      properties:
        CFBundleDisplayName: Pomo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Pomo scans the QR code on your Mac to pair this iPhone with it.
        NSLocalNetworkUsageDescription: Pomo syncs your timer directly with your other devices on the same network.
    entitlements:
      path: Generated/Pomo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.hamardikan.pomo

  PomoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
    dependencies:
      - package: PomoKit
        product: PomoLive
      - package: PomoUI
        product: PomoUI
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamardikan.pomo.ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Generated/PomoWidgets-Info.plist
      properties:
        CFBundleDisplayName: Pomo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/PomoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.hamardikan.pomo

  PomoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UI/**
    dependencies:
      - target: Pomo
      - package: PomoKit
        product: PomoKit
      - package: PomoKit
        product: PomoLive
      - package: PomoUI
        product: PomoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamardikan.pomo.ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  PomoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Pomo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hamardikan.pomo.ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pomo:
    build:
      targets:
        Pomo: all
        PomoWidgets: all
    test:
      targets:
        - PomoTests
        - PomoUITests
    run:
      config: Debug
  PomoWidgets:
    build:
      targets:
        PomoWidgets: all
