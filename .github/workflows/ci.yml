name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  swift:
    name: Swift packages
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Design system and view models
        working-directory: apple/shared
        run: swift test
      - name: Mac app (KeyComboTests)
        if: always()
        timeout-minutes: 3
        working-directory: apple/PomoMac
        run: swift test --filter KeyComboTests
      - name: Mac app (ShortcutsModelTests)
        if: always()
        timeout-minutes: 3
        working-directory: apple/PomoMac
        run: swift test --filter ShortcutsModelTests
      - name: Mac app (MenuBarGlyphTests)
        if: always()
        timeout-minutes: 3
        working-directory: apple/PomoMac
        run: swift test --filter MenuBarGlyphTests
      - name: Mac app (DaemonLauncherTests)
        if: always()
        timeout-minutes: 3
        working-directory: apple/PomoMac
        run: swift test --filter DaemonLauncherTests
