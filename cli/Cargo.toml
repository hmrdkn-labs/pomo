[package]
name = "pomo-cli"
version = "0.1.0"
edition = "2021"
description = "Pomo CLI and MCP server (thin clients of pomod)"

[lib]
name = "pomo_cli"
path = "src/lib.rs"

[[bin]]
name = "pomo"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
pomod = { path = "../daemon" }
tokio = { version = "1", features = ["rt-multi-thread"] }
tempfile = "3"
