[package]
name = "pomo-sync"
version = "0.1.0"
edition = "2021"
description = "Pomo Sync: peer-to-peer event exchange over iroh (spec/sync.md)"
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
pomo-core = { path = "../core" }
iroh = "=1.3.0"
iroh-tickets = "=1.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
